name: Generate recipes manifest

on:
  push:
    paths:
      - "recipes/*.md"
      - "generate-recipes.py"
      - ".github/workflows/generate-recipes.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate recipes.json
        run: python generate-recipes.py

      - name: Commit recipes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json
          git diff --cached --quiet || git commit -m "Update recipes manifest"
          git push
